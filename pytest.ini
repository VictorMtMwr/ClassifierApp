[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Pruebas unitarias
    integration: Pruebas de integración
    api: Pruebas de endpoints de API
    slow: Pruebas que tardan mucho tiempo
    requires_model: Pruebas que requieren modelos cargados

